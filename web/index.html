<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WebTester</title>
<style>
  :root { --bg:#0f1117; --panel:#1a1d27; --border:#2a2f3d; --text:#e6e9f0; --muted:#8b92a5;
          --high:#e5484d; --med:#f5a524; --low:#3b82f6; --info:#6b7280; --ok:#10b981; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
  header { padding: 12px 24px; border-bottom: 1px solid var(--border); display:flex; gap:20px; align-items:center; }
  header h1 { margin:0; font-size: 18px; }
  nav { display:flex; gap:4px; }
  nav button { background:transparent; color:var(--muted); border:1px solid transparent;
    padding:6px 12px; border-radius:4px; cursor:pointer; font-size:13px; }
  nav button.active { background:var(--panel); color:var(--text); border-color:var(--border); }
  main { display: grid; grid-template-columns: 360px 1fr; height: calc(100vh - 53px); }
  aside { border-right: 1px solid var(--border); padding: 16px; overflow-y:auto; }
  section.detail { padding: 16px 24px; overflow-y:auto; }
  fieldset { border: 1px solid var(--border); border-radius: 6px; margin: 0 0 16px; padding: 12px; }
  legend { padding: 0 6px; color: var(--muted); font-size: 12px; }
  label { display:block; font-size: 12px; color: var(--muted); margin: 8px 0 4px; }
  input, select, textarea { width: 100%; padding: 8px; background: var(--panel); color: var(--text);
    border: 1px solid var(--border); border-radius: 4px; font-family: inherit; font-size: 13px; }
  textarea { resize: vertical; min-height: 50px; font-family: monospace; }
  button.primary { padding: 8px 14px; background: var(--ok); color: #0f1117; border: none;
    border-radius: 4px; cursor: pointer; font-weight: 600; margin-top: 12px; }
  button.primary:disabled { background: #2a2f3d; color: #6b7280; cursor: not-allowed; }
  button.ghost { background: var(--panel); color: var(--text); border: 1px solid var(--border);
    padding: 4px 10px; font-size: 11px; border-radius: 4px; cursor: pointer; }
  .item { padding: 10px; border: 1px solid var(--border); border-radius: 6px;
    margin-bottom: 8px; cursor: pointer; }
  .item:hover { background: var(--panel); }
  .item.active { border-color: var(--ok); }
  .row { display:flex; justify-content: space-between; align-items:center; gap:8px; }
  .badge { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
  .badge.queued, .badge.running { background: var(--low); color: white; }
  .badge.completed { background: var(--ok); color: white; }
  .badge.failed, .badge.cancelled { background: var(--high); color: white; }
  .progress { height: 4px; background: var(--border); border-radius: 2px; margin-top: 6px; overflow: hidden; }
  .progress > div { height: 100%; background: var(--ok); transition: width 0.3s; }
  .finding { border: 1px solid var(--border); border-left: 3px solid; padding: 10px 12px;
    border-radius: 4px; margin-bottom: 8px; background: var(--panel); }
  .finding.High { border-left-color: var(--high); }
  .finding.Medium { border-left-color: var(--med); }
  .finding.Low { border-left-color: var(--low); }
  .finding.Info { border-left-color: var(--info); }
  .finding h4 { margin: 0 0 4px; font-size: 13px; }
  .finding .meta { font-size: 11px; color: var(--muted); display:flex; gap:10px; flex-wrap:wrap; }
  .finding .evidence { font-family: monospace; font-size: 11px; color: var(--muted);
    margin-top: 6px; word-break: break-all; }
  .muted { color: var(--muted); font-size: 12px; }
  .counts { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  .count { padding: 4px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; }
  .count.High { background: rgba(229,72,77,0.2); color: var(--high); }
  .count.Medium { background: rgba(245,165,36,0.2); color: var(--med); }
  .count.Low { background: rgba(59,130,246,0.2); color: var(--low); }
  .count.Info { background: rgba(107,114,128,0.2); color: var(--info); }
  .hidden { display: none; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin: 12px 0 16px; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 6px; padding: 10px 12px; }
  .stat .v { font-size: 20px; font-weight: 600; }
  .stat .l { font-size: 11px; color: var(--muted); margin-top: 2px; }
  table.status { width: 100%; border-collapse: collapse; margin-top: 8px; }
  table.status td, table.status th { padding: 6px 10px; text-align: left; font-size: 12px;
    border-bottom: 1px solid var(--border); }
  table.status th { color: var(--muted); font-weight: 500; }
</style>
</head>
<body>
<header>
  <h1>WebTester</h1>
  <nav>
    <button data-tab="scans" class="active">Security scans</button>
    <button data-tab="load">Load tests</button>
  </nav>
</header>

<main data-page="scans">
  <aside>
    <fieldset>
      <legend>New scan</legend>
      <label>Target URL</label>
      <input id="target" placeholder="http://localhost:8000" />
      <label>Scan type</label>
      <select id="scanType">
        <option value="baseline">baseline (passive)</option>
        <option value="api">api (OpenAPI)</option>
        <option value="full">full (active)</option>
      </select>
      <div id="openapiRow" class="hidden">
        <label>OpenAPI URL</label>
        <input id="openapi" placeholder="http://localhost:8000/api/v1/openapi.yaml" />
      </div>
      <label style="display:flex; gap:8px; align-items:center; margin-top:12px;">
        <input type="checkbox" id="ownership" style="width:auto;" />
        I own or have permission to test this target
      </label>
      <details style="margin-top:12px;">
        <summary class="muted" style="cursor:pointer;">Auth &amp; BOLA (optional)</summary>
        <label>Auth header</label>
        <input id="authHeader" value="Authorization" />
        <label>User A token</label>
        <input id="userA" placeholder="Bearer ..." />
        <label>User B token (BOLA probe)</label>
        <input id="userB" placeholder="Bearer ..." />
        <label>BOLA probe URLs (one per line)</label>
        <textarea id="bolaUrls"></textarea>
      </details>
      <button id="submit" class="primary">Start scan</button>
      <div id="error" class="muted" style="color:var(--high); margin-top:8px;"></div>
    </fieldset>
    <div class="row" style="margin-bottom:8px;">
      <strong style="font-size:13px;">Scans</strong>
      <button id="refresh" class="ghost">Refresh</button>
    </div>
    <div id="scanList"></div>
  </aside>
  <section class="detail">
    <div id="detailEmpty" class="muted">Select a scan or start a new one.</div>
    <div id="detail" class="hidden">
      <div class="row">
        <div>
          <div id="detailTarget" style="font-size:15px; font-weight:600;"></div>
          <div id="detailMeta" class="muted"></div>
        </div>
        <span id="detailStatus" class="badge"></span>
      </div>
      <div class="progress" style="margin: 12px 0;"><div id="detailProgress" style="width:0%;"></div></div>
      <div id="errorBox" class="muted" style="color:var(--high); margin-bottom:12px;"></div>
      <div id="counts" class="counts"></div>
      <div id="findings"></div>
    </div>
  </section>
</main>

<main data-page="load" class="hidden">
  <aside>
    <fieldset>
      <legend>New load test</legend>
      <label>Target URL</label>
      <input id="ltTarget" placeholder="http://localhost:8000/healthz" />
      <div class="grid2">
        <div>
          <label>Method</label>
          <select id="ltMethod">
            <option>GET</option><option>HEAD</option><option>OPTIONS</option>
            <option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option>
          </select>
        </div>
        <div>
          <label>Duration (s)</label>
          <input id="ltDuration" type="number" value="30" min="1" max="600" />
        </div>
      </div>
      <div class="grid2">
        <div>
          <label>Requests / second</label>
          <input id="ltRPS" type="number" value="50" min="1" max="5000" />
        </div>
        <div>
          <label>Concurrency</label>
          <input id="ltConcurrency" type="number" value="20" min="1" max="500" />
        </div>
      </div>
      <details style="margin-top:8px;">
        <summary class="muted" style="cursor:pointer;">Headers &amp; body</summary>
        <label>Headers (one per line, "Name: Value")</label>
        <textarea id="ltHeaders" placeholder="Authorization: Bearer ..."></textarea>
        <label>Request body</label>
        <textarea id="ltBody"></textarea>
      </details>
      <label style="display:flex; gap:8px; align-items:center; margin-top:12px;">
        <input type="checkbox" id="ltOwnership" style="width:auto;" />
        I own or have permission to load test this target
      </label>
      <button id="ltSubmit" class="primary">Start load test</button>
      <div id="ltError" class="muted" style="color:var(--high); margin-top:8px;"></div>
    </fieldset>
    <div class="row" style="margin-bottom:8px;">
      <strong style="font-size:13px;">Load tests</strong>
      <button id="ltRefresh" class="ghost">Refresh</button>
    </div>
    <div id="ltList"></div>
  </aside>
  <section class="detail">
    <div id="ltEmpty" class="muted">Select a load test or start a new one.</div>
    <div id="ltDetail" class="hidden">
      <div class="row">
        <div>
          <div id="ltTargetView" style="font-size:15px; font-weight:600;"></div>
          <div id="ltMeta" class="muted"></div>
        </div>
        <span id="ltStatusBadge" class="badge"></span>
      </div>
      <div class="progress" style="margin:12px 0;"><div id="ltProgress" style="width:0%;"></div></div>
      <div id="ltErrorBox" class="muted" style="color:var(--high); margin-bottom:12px;"></div>
      <div id="ltStats" class="stats"></div>
      <div id="ltLatency"></div>
      <div id="ltBreakdown"></div>
      <div id="ltErrorBreakdown"></div>
      <div style="margin-top:12px;">
        <button id="ltCancel" class="ghost hidden">Cancel</button>
      </div>
    </div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);

// Tabs
document.querySelectorAll('nav button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('nav button').forEach(b => b.classList.toggle('active', b === btn));
    document.querySelectorAll('main').forEach(m =>
      m.classList.toggle('hidden', m.dataset.page !== btn.dataset.tab));
  });
});

async function api(path, opts = {}) {
  const res = await fetch(path, opts);
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body?.error?.message || `HTTP ${res.status}`);
  return body.data;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* -------------------- Scans -------------------- */

$('scanType').addEventListener('change', (e) => {
  $('openapiRow').classList.toggle('hidden', e.target.value !== 'api');
});

$('submit').addEventListener('click', async () => {
  $('error').textContent = '';
  $('submit').disabled = true;
  try {
    const payload = {
      target_url: $('target').value.trim(),
      scan_type: $('scanType').value,
      confirm_ownership: $('ownership').checked,
    };
    if (payload.scan_type === 'api') payload.openapi_url = $('openapi').value.trim();
    const userA = $('userA').value.trim(), userB = $('userB').value.trim();
    if (userA) {
      payload.auth = { header_name: $('authHeader').value.trim() || 'Authorization', user_a: userA };
      if (userB) payload.auth.user_b = userB;
    }
    const bola = $('bolaUrls').value.split('\n').map(s => s.trim()).filter(Boolean);
    if (bola.length) payload.bola_probe_urls = bola;
    const scan = await api('/api/v1/scans', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(payload),
    });
    currentScanId = scan.id;
    await refreshScans();
    openScan(scan.id);
  } catch (e) { $('error').textContent = e.message; }
  finally { $('submit').disabled = false; }
});

$('refresh').addEventListener('click', refreshScans);

let currentScanId = null;
let scanPoll = null;

async function refreshScans() {
  try {
    const scans = await api('/api/v1/scans');
    const el = $('scanList');
    if (!scans || scans.length === 0) { el.innerHTML = '<div class="muted">No scans yet.</div>'; return; }
    el.innerHTML = scans.map(s => `
      <div class="item ${s.id === currentScanId ? 'active' : ''}" data-id="${s.id}">
        <div class="row">
          <span style="font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(s.target_url)}</span>
          <span class="badge ${s.status}">${s.status}</span>
        </div>
        <div class="muted" style="margin-top:4px; font-size:11px;">${s.scan_type} · ${s.findings_count} findings</div>
      </div>
    `).join('');
    el.querySelectorAll('.item').forEach(item => item.addEventListener('click', () => openScan(item.dataset.id)));
  } catch {}
}

async function openScan(id) {
  currentScanId = id;
  if (scanPoll) clearInterval(scanPoll);
  document.querySelectorAll('#scanList .item').forEach(el => el.classList.toggle('active', el.dataset.id === id));
  const s = await renderScan();
  if (!s || s.status === 'completed' || s.status === 'failed') return;
  scanPoll = setInterval(async () => {
    if (currentScanId !== id) { clearInterval(scanPoll); return; }
    const s2 = await renderScan();
    if (!s2 || s2.status === 'completed' || s2.status === 'failed') { clearInterval(scanPoll); refreshScans(); }
  }, 2000);
}

async function renderScan() {
  try {
    const s = await api(`/api/v1/scans/${currentScanId}`);
    $('detailEmpty').classList.add('hidden');
    $('detail').classList.remove('hidden');
    $('detailTarget').textContent = s.target_url;
    $('detailMeta').textContent = `${s.scan_type} · created ${new Date(s.created_at).toLocaleString()}`;
    $('detailStatus').className = `badge ${s.status}`;
    $('detailStatus').textContent = s.status;
    $('detailProgress').style.width = s.progress + '%';
    $('errorBox').textContent = s.error_message || '';
    if (s.status === 'completed') renderFindings(s.id);
    return s;
  } catch { return null; }
}

async function renderFindings(id) {
  try {
    const findings = await api(`/api/v1/scans/${id}/findings`);
    const counts = { High: 0, Medium: 0, Low: 0, Info: 0 };
    findings.forEach(f => { counts[f.severity] = (counts[f.severity] || 0) + 1; });
    $('counts').innerHTML = Object.entries(counts).filter(([, n]) => n > 0)
      .map(([sev, n]) => `<span class="count ${sev}">${n} ${sev}</span>`).join('')
      || '<span class="muted">No findings.</span>';
    $('findings').innerHTML = findings.map(f => `
      <div class="finding ${f.severity}">
        <h4>${escapeHtml(f.name)}</h4>
        <div class="meta"><span>${f.severity}</span><span>${f.confidence} confidence</span>
          <span>${escapeHtml(f.source)}</span><span>rule ${escapeHtml(f.rule_id)}</span></div>
        <div class="evidence">${escapeHtml(f.url)}</div>
        ${f.evidence ? `<div class="evidence">${escapeHtml(f.evidence)}</div>` : ''}
      </div>
    `).join('') || '<div class="muted">No findings.</div>';
  } catch {}
}

/* -------------------- Load tests -------------------- */

$('ltSubmit').addEventListener('click', async () => {
  $('ltError').textContent = '';
  $('ltSubmit').disabled = true;
  try {
    let headers = {};
    const rawHeaders = $('ltHeaders').value.trim();
    if (rawHeaders.startsWith('{')) {
      try { headers = JSON.parse(rawHeaders); } catch {}
    } else {
      rawHeaders.split('\n').forEach(line => {
        const i = line.indexOf(':');
        if (i > 0) headers[line.slice(0, i).trim()] = line.slice(i + 1).trim();
      });
    }
    const payload = {
      target_url: $('ltTarget').value.trim(),
      method: $('ltMethod').value,
      duration_seconds: parseInt($('ltDuration').value, 10),
      requests_per_sec: parseInt($('ltRPS').value, 10),
      concurrency: parseInt($('ltConcurrency').value, 10),
      confirm_ownership: $('ltOwnership').checked,
    };
    if (Object.keys(headers).length) payload.headers = headers;
    const body = $('ltBody').value;
    if (body) payload.body = body;
    const lt = await api('/api/v1/load-tests', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(payload),
    });
    currentLoadId = lt.id;
    await refreshLoads();
    openLoad(lt.id);
  } catch (e) { $('ltError').textContent = e.message; }
  finally { $('ltSubmit').disabled = false; }
});

$('ltRefresh').addEventListener('click', refreshLoads);
$('ltCancel').addEventListener('click', async () => {
  if (!currentLoadId) return;
  try { await api(`/api/v1/load-tests/${currentLoadId}/cancel`, { method: 'POST' }); }
  catch (e) { $('ltErrorBox').textContent = e.message; }
});

let currentLoadId = null;
let loadPoll = null;

async function refreshLoads() {
  try {
    const lts = await api('/api/v1/load-tests');
    const el = $('ltList');
    if (!lts || lts.length === 0) { el.innerHTML = '<div class="muted">No load tests yet.</div>'; return; }
    el.innerHTML = lts.map(lt => `
      <div class="item ${lt.id === currentLoadId ? 'active' : ''}" data-id="${lt.id}">
        <div class="row">
          <span style="font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(lt.method)} ${escapeHtml(lt.target_url)}</span>
          <span class="badge ${lt.status}">${lt.status}</span>
        </div>
        <div class="muted" style="margin-top:4px; font-size:11px;">
          ${lt.duration_seconds}s @ ${lt.requests_per_sec} rps · ${lt.total_requests} reqs
        </div>
      </div>
    `).join('');
    el.querySelectorAll('.item').forEach(item => item.addEventListener('click', () => openLoad(item.dataset.id)));
  } catch {}
}

async function openLoad(id) {
  currentLoadId = id;
  if (loadPoll) clearInterval(loadPoll);
  document.querySelectorAll('#ltList .item').forEach(el => el.classList.toggle('active', el.dataset.id === id));
  const s = await renderLoad();
  if (!s || s.status === 'completed' || s.status === 'failed' || s.status === 'cancelled') return;
  loadPoll = setInterval(async () => {
    if (currentLoadId !== id) { clearInterval(loadPoll); return; }
    const s2 = await renderLoad();
    if (!s2 || s2.status === 'completed' || s2.status === 'failed' || s2.status === 'cancelled') {
      clearInterval(loadPoll); refreshLoads();
    }
  }, 1000);
}

function fmtMs(n) { return (n ?? 0).toFixed(1) + ' ms'; }
function fmtNum(n) { return (n ?? 0).toLocaleString(); }

async function renderLoad() {
  try {
    const lt = await api(`/api/v1/load-tests/${currentLoadId}`);
    $('ltEmpty').classList.add('hidden');
    $('ltDetail').classList.remove('hidden');
    $('ltTargetView').textContent = `${lt.method} ${lt.target_url}`;
    $('ltMeta').textContent = `${lt.duration_seconds}s · target ${lt.requests_per_sec} rps · concurrency ${lt.concurrency}`;
    $('ltStatusBadge').className = `badge ${lt.status}`;
    $('ltStatusBadge').textContent = lt.status;
    const isRunning = lt.status === 'running' || lt.status === 'queued';
    $('ltCancel').classList.toggle('hidden', !isRunning);
    const elapsed = lt.started_at ? (new Date() - new Date(lt.started_at)) / 1000 : 0;
    const pct = lt.status === 'queued' ? 0
      : lt.status === 'running' ? Math.min(99, Math.round(elapsed / lt.duration_seconds * 100))
      : 100;
    $('ltProgress').style.width = pct + '%';
    $('ltErrorBox').textContent = lt.error_message || '';

    $('ltStats').innerHTML = `
      <div class="stat"><div class="v">${fmtNum(lt.total_requests)}</div><div class="l">total requests</div></div>
      <div class="stat"><div class="v">${fmtNum(lt.successful)}</div><div class="l">successful (2xx/3xx)</div></div>
      <div class="stat"><div class="v">${fmtNum(lt.failed)}</div><div class="l">failed</div></div>
      <div class="stat"><div class="v">${(lt.error_rate ?? 0).toFixed(2)}%</div><div class="l">error rate</div></div>
      <div class="stat"><div class="v">${(lt.rps_achieved ?? 0).toFixed(1)}</div><div class="l">rps achieved</div></div>
      <div class="stat"><div class="v">${fmtMs(lt.p50_ms)}</div><div class="l">p50 latency</div></div>
      <div class="stat"><div class="v">${fmtMs(lt.p95_ms)}</div><div class="l">p95 latency</div></div>
      <div class="stat"><div class="v">${fmtMs(lt.p99_ms)}</div><div class="l">p99 latency</div></div>
    `;

    $('ltLatency').innerHTML = lt.total_requests > 0 ? `
      <h3 style="font-size:14px; margin:16px 0 8px;">Latency distribution</h3>
      <table class="status">
        <thead><tr><th>min</th><th>mean</th><th>p50</th><th>p90</th><th>p95</th><th>p99</th><th>max</th></tr></thead>
        <tbody><tr>
          <td>${fmtMs(lt.min_ms)}</td><td>${fmtMs(lt.mean_ms)}</td>
          <td>${fmtMs(lt.p50_ms)}</td><td>${fmtMs(lt.p90_ms)}</td>
          <td>${fmtMs(lt.p95_ms)}</td><td>${fmtMs(lt.p99_ms)}</td>
          <td>${fmtMs(lt.max_ms)}</td>
        </tr></tbody>
      </table>` : '';

    const breakdown = lt.status_breakdown || {};
    const keys = Object.keys(breakdown).sort();
    $('ltBreakdown').innerHTML = keys.length ? `
      <h3 style="font-size:14px; margin:16px 0 8px;">Status code breakdown</h3>
      <table class="status">
        <thead><tr><th>code</th><th>count</th></tr></thead>
        <tbody>${keys.map(k => `<tr><td>${k}</td><td>${fmtNum(breakdown[k])}</td></tr>`).join('')}</tbody>
      </table>` : '';

    const errBreakdown = lt.error_breakdown || {};
    const errKeys = Object.keys(errBreakdown).sort((a,b) => errBreakdown[b] - errBreakdown[a]);
    $('ltErrorBreakdown').innerHTML = errKeys.length ? `
      <h3 style="font-size:14px; margin:16px 0 8px; color:var(--high);">Network Errors</h3>
      <table class="status">
        <thead><tr><th>Error Message</th><th>Count</th></tr></thead>
        <tbody>${errKeys.map(k => `<tr><td>${escapeHtml(k)}</td><td>${fmtNum(errBreakdown[k])}</td></tr>`).join('')}</tbody>
      </table>` : '';

    return lt;
  } catch { return null; }
}

refreshScans();
refreshLoads();
</script>
</body>
</html>
